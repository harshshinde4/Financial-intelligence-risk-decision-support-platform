services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_ai}
      POSTGRES_USER: ${POSTGRES_USER:-financial_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_ai_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial_ai} -d ${POSTGRES_DB:-financial_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-ai-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
