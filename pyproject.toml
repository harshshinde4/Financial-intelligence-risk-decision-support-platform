[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-intelligence-platform"
version = "0.1.0"
description = "Production-oriented Financial Intelligence & Risk Decision Support Platform"
requires-python = ">=3.12"
dependencies = [
    # API / application
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",

    # Database / migrations
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",

    # Logging
    "structlog>=24.4,<26.0",

    # Data engineering
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18,<24",

    # Market data
    "yfinance>=0.2.60,<1.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

ml = [
    # Scientific computing
    "scipy>=1.14,<2.0",
    "statsmodels>=0.14,<1.0",
    "shap>=0.46,<1.0",

    # Classical ML
    "scikit-learn>=1.5,<2.0",

    # Gradient boosting
    "xgboost>=2.1,<4.0",
    "lightgbm>=4.5,<5.0",
]

nlp = [
    # NLP
    "nltk>=3.9,<4.0",
    "transformers>=4.45,<6.0",

    # Deep learning backend
    "torch>=2.5,<3.0",

    # Embeddings / semantic similarity
    "sentence-transformers>=3.0,<6.0",
]

llm = [
    # LLM API integration
    "openai>=1.50,<3.0",

    # Vector database / local RAG foundation
    "chromadb>=0.5,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []